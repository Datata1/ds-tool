[package]
name = "ap-planner-desktop"
version = "0.1.0"
description = "AP-Planer - Angriffsplaner für Die Stämme"
edition = "2021"
rust-version = "1.87"

[lib]
name = "ap_planner_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
