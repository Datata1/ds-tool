name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  # Tag v* → build the Claude Desktop extension and attach it to the GitHub release.
  extension:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --no-dev python scripts/build_mcpb.py
      - name: Truppen-Skript als eine Zeile für die Schnellleiste
        run: uv run --no-dev python -c "from ap_planner import ingame; print(ingame.quickbar_code())" > dist/truppen-schnellleiste.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AP-Planer ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/ap-planner.mcpb
            dist/ap-planner-plugin.zip
            dist/truppen-schnellleiste.txt
